[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semverlite"
version = "0.1.0"
description = "Strict semver 2.0.0 parsing, comparison, and utilities for developers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Nripanka Das", email = "nripankadas07@gmail.com"}]
keywords = ["semver", "semantic-versioning", "version", "parser", "comparison"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/nripankadas07/semverlite"
Repository = "https://github.com/nripankadas07/semverlite.git"
Issues = "https://github.com/nripankadas07/semverlite/issues"

[tool.setuptools]
packages = ["semverlite"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/semverlite"]
